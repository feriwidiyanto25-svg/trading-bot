name: Crypto Screener & Whale Radar

on:
  # 1. Jadwal otomatis (Cron)
  schedule:
    # Berjalan setiap 1 jam (misal: jam 01:00, 02:00, 03:00, dst)
    - cron: '0 * * * *'
    # Catatan: Jika ingin berjalan setiap 4 jam (sesuai candle 4H), ganti dengan: '0 */4 * * *'

  # 2. Bisa dijalankan manual kapan saja lewat tombol "Run workflow" di GitHub
  workflow_dispatch:
    inputs:
      timeframe:
        description: 'Pilih Timeframe Analisis'
        required: true
        default: '4h'
        type: choice
        options:
          - '15m'
          - '1h'
          - '4h'

jobs:
  run-screener:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Diperlukan agar bot bisa menyimpan riwayat signals_history.json

    steps:
      - name: Checkout Kode
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependensi
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Jalankan Screener & Kirim Alert Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python main.py --telegram --timeframe ${{ github.event.inputs.timeframe || '4h' }}

      - name: Simpan & Commit Riwayat Sinyal
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add signals_history.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: update signals history [skip ci]" && git push)
